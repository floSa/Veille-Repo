name: generer-diagrammes
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      lot:
        description: "Taille du lot"
        default: "20"
permissions:
  contents: write
concurrency:
  group: generer-diagrammes
  cancel-in-progress: false
jobs:
  generer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: etat-diagrammes
          path: etat
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm init -y >/dev/null
          npm i playwright@1.49.1
          npx playwright install --with-deps chromium
      - run: node .github/generer_diagrammes.mjs .github/file-diagrammes.txt etat/etat.json ${{ inputs.lot || '20' }}
      - name: Enregistrer l'état
        working-directory: etat
        run: |
          git config user.name "generer-diagrammes"
          git config user.email "actions@users.noreply.github.com"
          git add etat.json
          git commit -m "état $(date -u +%FT%H:%M)" || exit 0
          for i in 1 2 3; do git push origin HEAD:etat-diagrammes && break || (git pull --rebase origin etat-diagrammes; sleep 5); done
