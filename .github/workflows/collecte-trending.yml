name: collecte-trending
on:
  schedule:
    - cron: "40 5 * * *"
    - cron: "50 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Branche de données
        run: |
          cp .github/collecte_trending.py /tmp/
          if git ls-remote --exit-code --heads origin trending-quotidien >/dev/null; then
            git fetch origin trending-quotidien && git checkout -f trending-quotidien
          else
            git checkout --orphan trending-quotidien && git rm -rf . >/dev/null
          fi
      - name: Lire la page trending
        run: python3 /tmp/collecte_trending.py
      - name: Enregistrer
        run: |
          git config user.name "collecte-trending"
          git config user.email "actions@users.noreply.github.com"
          git add trending
          git commit -m "trending $(date -u +%F)" || exit 0
          git push origin trending-quotidien
